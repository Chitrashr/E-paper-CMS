<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epaper Layout</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-left">
                <div class="logo">EELOKA</div>
            </div>
            <button class="burger" aria-label="Menu">☰</button>

            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="">About Us</a></li>
                <li><a href="">Contact Us</a></li>
                <li><a href="">Privacy Policy</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section class="epaper-section">
            <div class="top-row">
                <div class="top-card-wrapper" id="today-paper-container">
                    
                </div>

                <div class="top-card-wrapper live-card">
                    <div class="live-header">
                        <h3>Eeloka Live</h3>
                        <button class="btn-yt" onclick="window.open('https://youtube.com', '_blank')">Open on
                            YouTube</button>
                    </div>
                    <div class="live-thumbnail-wrapper">
                        <iframe src="https://www.youtube.com/embed/LIVE_VIDEO_ID?autoplay=0" title="Live Stream"
                            frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
                        </iframe>
                    </div>
                    <div class="live-info">
                        <h4>Eeloka</h4>
                        <p id="live-date">Loading...</p>
                        <span>Daily Edition</span>
                    </div>
                </div>

                <div class="top-card-wrapper calendar-wrapper" id="homepage-calendar">
                </div>
            </div>

            <div class="epaper-grid">
                
            </div>
        </section>
    </main>

    <div class="pages">
        <div class="first">First</div>
        <div class="page">1</div>
        <div class="page active">2</div>
        <div class="page">3</div>
        <div class="page">4</div>
        <div class="last">Last</div>
    </div>

    <footer class="footer">
        <div class="socials">
            <a href="#" class="icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fab fa-x-twitter"></i></a>
            <a href="#" class="icon"><i class="fab fa-instagram"></i></a>
            <a href="#" class="icon"><i class="fab fa-youtube"></i></a>
            <a href="mailto:example@gmail.com" class="icon"><i class="fas fa-envelope"></i></a>
        </div>
    </footer>

    <script src="main.js"></script>
</body>

</html>
